<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Mood Orbs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.4' cy='.36' r='.7'%3E%3Cstop offset='0' stop-color='%23fff6dc'/%3E%3Cstop offset='.45' stop-color='%23f4a62a'/%3E%3Cstop offset='1' stop-color='%23b8530e'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
  :root {
    --ink: #1d2230;
    --ink-2: rgba(29, 34, 48, .68);
    --ink-3: rgba(29, 34, 48, .46);
    --line: rgba(29, 34, 48, .09);
    --chip: rgba(29, 34, 48, .06);
    --glass: rgba(255, 255, 255, .74);
    --lift: 0 12px 34px rgba(36, 44, 78, .11), 0 2px 8px rgba(36, 44, 78, .06);
    --edge: inset 0 0 0 1px rgba(255, 255, 255, .85), 0 0 0 1px rgba(29, 34, 48, .07);
    --ease: cubic-bezier(.45, 0, .2, 1);
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --key: linear-gradient(90deg, #5c38cc, #2a8fe0, #38b3ab, #e0b838, #f26b1f);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: #fff; color: var(--ink);
    font: 14px/1.4 var(--sans);
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; }
  svg.i { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

  #scene {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; outline: none; cursor: grab;
  }
  #scene.hot { cursor: pointer; }
  #scene.dragging { cursor: grabbing; }
  body.flying #scene { cursor: crosshair; }
  body.flying.locked #scene { cursor: none; }

  /* ---- search: a pill that grows into a card ---- */
  .finder {
    position: fixed; z-index: 10; left: 50%; top: max(16px, env(safe-area-inset-top));
    width: min(300px, calc(100vw - 32px));
    transform: translateX(-50%);
    border-radius: 22px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%);
    box-shadow: var(--lift), var(--edge);
    transition: width .45s var(--ease), opacity .45s var(--ease), background .45s var(--ease), box-shadow .3s var(--ease);
  }
  .finder.wide { width: min(360px, calc(100vw - 32px)); }
  .finder.open { width: min(600px, calc(100vw - 24px)); background: rgba(255, 255, 255, .84); }
  body.flying .finder { opacity: 0; pointer-events: none; }
  .pill { display: flex; align-items: center; gap: 9px; height: 44px; padding: 0 10px 0 16px; cursor: text; }
  .pill svg { color: var(--ink-3); }
  .pill input {
    flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: transparent;
    font: 15px/1 var(--sans); color: var(--ink);
  }
  .pill input::placeholder { color: var(--ink-3); }
  .pill input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .clear {
    flex: none; display: grid; place-items: center; width: 28px; height: 28px; padding: 0;
    border: 0; border-radius: 50%; background: transparent; color: var(--ink-3); cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity .25s var(--ease), background .2s var(--ease);
  }
  .clear svg.i { width: 15px; height: 15px; }
  .clear:hover { background: var(--chip); color: var(--ink); }
  .finder.has-text .clear { opacity: 1; pointer-events: auto; }
  .drawer { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease); }
  .finder.open .drawer { grid-template-rows: 1fr; }
  .drawer-in { min-height: 0; overflow: hidden; }
  .drawer-note { margin: 0; padding: 9px 18px 0; font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--line); }
  .drawer-note:empty { display: none; }
  .results {
    list-style: none; margin: 0; padding: 6px 6px 8px;
    max-height: calc(100dvh - 150px); overflow-y: auto; overscroll-behavior: contain;
    border-top: 1px solid var(--line);
  }
  .drawer-note:not(:empty) + .results { border-top: 0; }
  .res {
    display: flex; gap: 11px; align-items: flex-start;
    padding: 8px 10px 9px; border-radius: 14px; cursor: pointer;
    transition: background .2s var(--ease);
  }
  .res:hover { background: rgba(29, 34, 48, .04); }
  .res.on { background: rgba(29, 34, 48, .065); }
  .mood-dot {
    flex: none; width: 11px; height: 11px; margin-top: 4px; border-radius: 50%;
    background: radial-gradient(circle at 36% 32%, rgba(255, 255, 255, .75) 0 16%, transparent 46%), var(--c);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 16%, transparent);
  }
  .res-main { flex: 1; min-width: 0; }
  .res-top { display: flex; gap: 9px; align-items: baseline; min-width: 0; }
  .res-date { flex: none; font-size: 12.5px; font-weight: 600; color: var(--ink); }
  .res-gist { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
  .res-sub { display: flex; flex-wrap: wrap; gap: 4px 5px; align-items: center; margin-top: 5px; }
  .chip {
    display: inline-block; padding: 2px 8px; border-radius: 99px;
    background: var(--chip); color: var(--ink-2);
    font-size: 11.5px; line-height: 16px; white-space: nowrap;
  }
  .why { margin-left: 3px; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- small titles that float above an orb ---- */
  .tip {
    position: fixed; left: 0; top: 0; z-index: 6; width: 0; height: 0;
    pointer-events: none; opacity: 0; transition: opacity .3s var(--ease);
  }
  .tip.show { opacity: 1; }
  .tip-in {
    position: absolute; left: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    transform: translate(-50%, 5px); transition: transform .4s var(--ease);
  }
  .tip.show .tip-in { transform: translate(-50%, 0); }
  .tip-title {
    padding: 5px 11px; border-radius: 99px; white-space: nowrap;
    background: rgba(255, 255, 255, .86);
    -webkit-backdrop-filter: blur(12px) saturate(160%); backdrop-filter: blur(12px) saturate(160%);
    box-shadow: 0 4px 16px rgba(36, 44, 78, .12), var(--edge);
    font: 500 12.5px/1.25 var(--sans); color: var(--ink);
  }
  .tip-chips { display: flex; gap: 4px; }
  .tip-chips:empty { display: none; }
  .tip-chips .chip { background: rgba(255, 255, 255, .84); box-shadow: 0 0 0 1px rgba(29, 34, 48, .07); }

  /* ---- the quiet bar at the bottom ---- */
  .bar {
    position: fixed; z-index: 10; left: 50%; bottom: max(16px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 2px; padding: 5px;
    max-width: calc(100vw - 20px);
    border-radius: 99px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(20px) saturate(170%); backdrop-filter: blur(20px) saturate(170%);
    box-shadow: var(--lift), var(--edge);
  }
  .bar button {
    display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px;
    border: 0; border-radius: 99px; background: transparent; color: var(--ink-2);
    font-size: 13px; white-space: nowrap; cursor: pointer;
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .bar button:hover { background: rgba(29, 34, 48, .06); color: var(--ink); }
  .bar button:focus-visible, .res:focus-visible, .rel:focus-visible, .card-x:focus-visible {
    outline: 2px solid rgba(60, 110, 230, .45); outline-offset: 1px;
  }
  .pill input:focus-visible { outline: none; }
  .finder:focus-within { box-shadow: var(--lift), var(--edge), 0 0 0 3px rgba(60, 110, 230, .14); }
  .bar .alt { display: none; }
  .bar.out #btnSpread .alt { display: block; }
  .bar.out #btnSpread .main { display: none; }
  .bar.muted #btnSound .main { display: none; }
  .bar.muted #btnSound .alt { display: block; }
  .drone-wrap { display: grid; grid-template-columns: 0fr; opacity: 0; transition: grid-template-columns .45s var(--ease), opacity .35s var(--ease); }
  .drone-wrap > div { min-width: 0; overflow: hidden; }
  .drone-wrap.show { grid-template-columns: 1fr; opacity: 1; }
  .sep { flex: none; width: 1px; height: 18px; margin: 0 5px; background: var(--line); }
  .key { display: flex; align-items: center; gap: 7px; padding: 0 12px 0 6px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .key i { display: block; width: 64px; height: 6px; border-radius: 99px; background: var(--key); }

  /* ---- drone ---- */
  .drone-dot {
    position: fixed; left: 50%; top: 50%; z-index: 8; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: rgba(29, 34, 48, .6); box-shadow: 0 0 0 2px rgba(255, 255, 255, .9);
    opacity: 0; transition: opacity .4s var(--ease); pointer-events: none;
  }
  body.flying .drone-dot { opacity: 1; }
  .hint {
    position: fixed; z-index: 9; left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 58px);
    max-width: calc(100vw - 32px); transform: translateX(-50%);
    padding: 8px 15px; border-radius: 99px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%);
    box-shadow: var(--lift), var(--edge);
    font-size: 12.5px; color: var(--ink-2); text-align: center;
    opacity: 0; transition: opacity .5s var(--ease); pointer-events: none;
  }
  .hint.show { opacity: 1; }

  /* ---- the open morning: a liquid-glass card ---- */
  .veil {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(248, 249, 253, .16);
    opacity: 0; pointer-events: none; transition: opacity .5s var(--ease);
  }
  .veil.show { opacity: 1; pointer-events: auto; }
  .card, .card-shadow { position: fixed; left: 0; top: 0; width: 0; height: 0; border-radius: 28px; }   /* placed and sized from script */
  .card-shadow { z-index: 21; box-shadow: 0 34px 90px rgba(36, 44, 78, .20), 0 8px 26px rgba(36, 44, 78, .10); opacity: 0; pointer-events: none; }
  .card {
    z-index: 22; overflow: hidden;
    background: linear-gradient(155deg, rgba(255, 255, 255, .70), rgba(255, 255, 255, .46));
    -webkit-backdrop-filter: blur(28px) saturate(190%); backdrop-filter: blur(28px) saturate(190%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .95),
      inset 0 0 0 1px rgba(255, 255, 255, .62),
      inset 0 -1px 0 rgba(255, 255, 255, .4),
      inset 0 0 44px rgba(255, 255, 255, .22);
    outline: none;
  }
  .card[hidden], .card-shadow[hidden] { display: none; }
  .card::before {                     /* a soft sheen across the glass */
    content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; border-radius: inherit;
    background:
      radial-gradient(120% 70% at 10% -12%, rgba(255, 255, 255, .7), transparent 52%),
      radial-gradient(90% 60% at 104% 112%, rgba(255, 255, 255, .3), transparent 60%);
  }
  .card-skin {                        /* the orb itself, for the moment it grows and shrinks: a glowing world in clear glass */
    position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: 0;
    background:
      radial-gradient(circle at 36% 30%, rgba(255, 255, 255, .55) 0 6%, transparent 20%),
      radial-gradient(circle at 50% 52%, var(--lite) 0%, var(--c) 34%, color-mix(in srgb, var(--c) 46%, transparent) 66%, color-mix(in srgb, var(--c) 30%, transparent) 100%);
  }
  .card-inner {                       /* the content keeps its final size while the glass grows around it */
    position: absolute; left: 50%; top: 50%; translate: -50% -50%; z-index: 1;
    display: flex; flex-direction: column;
  }
  .card-x {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    display: grid; place-items: center; width: 34px; height: 34px; padding: 0;
    border: 0; border-radius: 50%; cursor: pointer; color: var(--ink-2);
    background: rgba(255, 255, 255, .72);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    box-shadow: 0 0 0 1px rgba(29, 34, 48, .08), 0 2px 10px rgba(36, 44, 78, .10);
    transition: background .2s var(--ease), color .2s var(--ease);
  }
  .card-x:hover { background: #fff; color: var(--ink); }
  .card-scroll { position: relative; z-index: 1; flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 20px 22px 18px; }
  .card-img {
    display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
    border-radius: 18px; background: rgba(29, 34, 48, .05);
    box-shadow: 0 8px 24px rgba(36, 44, 78, .14);
  }
  .card-when { margin: 16px 0 3px; font-size: 12.5px; color: var(--ink-3); }
  .card-title { margin: 0; font: 600 21px/1.25 var(--sans); letter-spacing: -.005em; }
  .card-gist { margin: 7px 0 0; font-size: 15.5px; line-height: 1.5; }
  .card-text {
    margin: 12px 0 0; max-height: 240px; overflow-y: auto; padding-right: 6px;
    white-space: pre-wrap; font: 15px/1.6 var(--serif); color: var(--ink-2);
  }
  .card-quote {
    margin: 13px 0 0; padding: 1px 0 1px 14px; border-left: 3px solid var(--c);
    font: italic 16.5px/1.5 var(--serif); color: var(--ink-2);
  }
  .card-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .card-chips .chip { font-size: 12px; padding: 3px 10px; background: rgba(255, 255, 255, .6); box-shadow: 0 0 0 1px rgba(29, 34, 48, .08); }
  .related { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .related h3 { margin: 0 0 6px 2px; font: 600 13px/1.2 var(--sans); color: var(--ink-2); }
  .related ul { list-style: none; margin: 0; padding: 0; }
  .rel {
    display: flex; gap: 12px; align-items: center; width: 100%; padding: 7px 8px;
    border: 0; border-radius: 14px; background: transparent; text-align: left; cursor: pointer;
    transition: background .2s var(--ease);
  }
  .rel:hover { background: rgba(255, 255, 255, .62); }
  .rel img { flex: none; width: 64px; height: 36px; object-fit: cover; border-radius: 8px; background: rgba(29, 34, 48, .06); box-shadow: 0 2px 8px rgba(36, 44, 78, .12); }
  .rel-main { min-width: 0; flex: 1; }
  .rel-top { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
  .rel-date { font-size: 13px; font-weight: 600; margin-right: 2px; }
  .rel .chip { font-size: 11px; padding: 1px 7px; }
  .rel-why { display: block; margin-top: 3px; font-size: 12.5px; color: var(--ink-3); }

  .problem {
    position: fixed; inset: 0; z-index: 50; display: none; place-items: center;
    padding: 24px; text-align: center; font-size: 15px; color: var(--ink-2); background: #fff;
  }
  .problem.show { display: grid; }

  @media (max-width: 560px) {
    .bar button { padding: 0 10px; gap: 6px; }
    .bar .long { display: none; }
    .key { padding: 0 9px 0 4px; gap: 5px; }
    .key i { width: 40px; }
    .card-scroll { padding: 16px 16px 14px; }
    .card-title { font-size: 19px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .finder, .drawer, .tip, .tip-in, .veil, .hint, .drone-wrap, .res, .rel { transition-duration: .2s !important; }
  }
</style>

{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js": "sha384-qlO/ZugKPxAQUAvTlQoo0QECzxJIJySZmCF/DHdb2Xn/hHndFwX/vfUAC9Hbk6LP"
  }
}

<body>
<canvas id="scene" role="img" aria-label="Your mornings as glowing glass orbs"></canvas>

<div class="finder" id="finder">
  <label class="pill">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
    <input id="q" type="search" placeholder="Search your mornings" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search your mornings" aria-controls="results" aria-expanded="false">
    <button class="clear" id="clear" type="button" aria-label="Clear the search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  </label>
  <div class="drawer"><div class="drawer-in">
    <p class="drawer-note" id="note"></p>
    <ul class="results" id="results" role="listbox" aria-label="Mornings that match"></ul>
  </div></div>
</div>

<div class="tip" id="tipHover"><div class="tip-in"><span class="tip-title"></span><span class="tip-chips"></span></div></div>
<div class="tip" id="tipFocus"><div class="tip-in"><span class="tip-title"></span><span class="tip-chips"></span></div></div>

<nav class="bar" id="bar" aria-label="View">
  <button id="btnSpread" type="button">
    <svg class="i main" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.4"/><circle cx="5" cy="6" r="1.5"/><circle cx="19" cy="6.5" r="1.5"/><circle cx="4.6" cy="17.4" r="1.5"/><circle cx="18.6" cy="18" r="1.5"/></svg>
    <svg class="i alt" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10.2" r="2.7"/><circle cx="14.6" cy="11.4" r="2.7"/><circle cx="11.6" cy="15" r="2.7"/><circle cx="12" cy="12" r="8.6" stroke-dasharray="2 3.2"/></svg>
    <span id="spreadWord">Explode</span>
  </button>
  <div class="drone-wrap" id="droneWrap"><div>
    <button id="btnDrone" type="button" tabindex="-1">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.4 20.4 4.2l-6.6 16.1-2.6-6.4z"/><path d="m11.2 13.9 3.9-3.9"/></svg>
      <span id="droneWord">Drone</span>
    </button>
  </div></div>
  <button id="btnReset" type="button">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.6 12a7.4 7.4 0 1 0 2.3-5.4"/><path d="M4.4 4.6v3.5h3.5"/></svg>
    <span>Reset<span class="long"> view</span></span>
  </button>
  <button id="btnSound" type="button" aria-pressed="true" aria-label="Sound">
    <svg class="i main" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5h3l4.2-3.6v12.2L7.5 14.5h-3z"/><path d="M15.2 9.2a4 4 0 0 1 0 5.6"/><path d="M17.8 6.8a7.4 7.4 0 0 1 0 10.4"/></svg>
    <svg class="i alt" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5h3l4.2-3.6v12.2L7.5 14.5h-3z"/><path d="m15.6 9.6 4.8 4.8m0-4.8-4.8 4.8"/></svg>
    <span class="long" id="soundWord">Sound on</span>
  </button>
  <span class="sep" aria-hidden="true"></span>
  <div class="key" role="img" aria-label="Colour key: painful mornings are blue and violet, joyful mornings are gold and amber"><span>painful</span><i></i><span>joyful</span></div>
</nav>

<div class="drone-dot" aria-hidden="true"></div>
<div class="hint" id="hint" role="status" aria-live="polite"></div>

<div class="veil" id="veil"></div>
<div class="card-shadow" id="cardShadow" hidden></div>
<article class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle" tabindex="-1" hidden>
  <div class="card-skin" id="cardSkin"></div>
  <div class="card-inner" id="cardInner">
  <button class="card-x" id="cardX" type="button" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  <div class="card-scroll" id="cardScroll">
    <div class="card-body" id="cardBody">
      <img class="card-img" id="cardImg" alt="" decoding="async">
      <p class="card-when" id="cardWhen"></p>
      <h2 class="card-title" id="cardTitle"></h2>
      <p class="card-gist" id="cardGist"></p>
      <div class="card-text" id="cardText" hidden></div>
      <blockquote class="card-quote" id="cardQuote"></blockquote>
      <div class="card-chips" id="cardChips"></div>
      <section class="related">
        <h3>Related mornings</h3>
        <ul id="relList"></ul>
      </section>
    </div>
  </div>
  </div>
</article>

<div class="problem" id="problem">The orbs could not load their drawing tools. Please check your internet connection, then reload this page.</div>

<script src="entries.js"></script>
<script src="lexicon.js"></script>

// A talky tick: a tiny puff of breath through two mouth-like resonances whose pitch slides a little,

function voiceTick(ctx, dest, t, noise, o) {

/* ---------- colour: painful → joyful, readable on white ---------- */
const MOOD_STOPS = [
  [-1.00, [0.37, 0.22, 0.80]],   // deep violet
  [-0.62, [0.24, 0.35, 0.90]],   // blue
  [-0.28, [0.15, 0.56, 0.88]],   // sky
  [ 0.00, [0.16, 0.70, 0.66]],   // soft teal
  [ 0.14, [0.50, 0.77, 0.40]],   // fresh green-gold, so the in-between never turns muddy
  [ 0.28, [0.91, 0.74, 0.18]],   // warm gold
  [ 0.62, [0.97, 0.60, 0.14]],   // amber gold

const sorted = ENTRIES.slice().sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : a.n - b.n));

// The world inside each orb: a deeper shade for its thick mist and a pale one for its light.
// Painful worlds sink toward violet, joyful ones lift toward gold, so nothing turns brown or grey.
function worldShades(col, mood) {
  const [h, s, l] = rgbToHsl(col);

const items = sorted.map((e, i) => {

    nest: [seed(), seed(), seed(), e.note ? 1 : 0],   // where this world sits in the shared noise, so no two look alike
    css: toCss(col),

/* for checking the page from outside (used by the automated look-over) */
function kWeight(x) {                             // the standard loudness filter (ITU-R BS.1770), at 48 kHz
  const y = new Float64Array(x.length);
  const run = (src, b0, b1, b2, a1, a2) => {
    let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let n = 0; n < src.length; n++) {
      const v = b0 * src[n] + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
      x2 = x1; x1 = src[n]; y2 = y1; y1 = v; y[n] = v;
    }
  };
  run(x, 1.53512485958697, -2.69169618940638, 1.19839281085285, -1.69065929318241, 0.73248077421585);
  run(y.slice(), 1, -2, 1, -1.99004745483398, 0.99007225036621);
  return y;
}
function measureSound(buf) {                      // peak (dBFS) and loudness (LUFS)
  const sr = buf.sampleRate, len = buf.length, chans = [];

    const x = buf.getChannelData(c);
    for (let n = 0; n < len; n++) peak = Math.max(peak, Math.abs(x[n]));
    chans.push(kWeight(x));
  }
  const sq = new Float64Array(len + 1);
  for (let n = 0; n < len; n++) { let s = 0; for (const y of chans) s += y[n] * y[n]; sq[n + 1] = sq[n] + s; }

  const windowMax = secs => {
    const w = Math.round(secs * sr), hop = Math.round(0.01 * sr);
    let best = 0;
    for (let s = 0; s + w <= len; s += hop) best = Math.max(best, (sq[s + w] - sq[s]) / w);
    return L(best);
  };
  const w = Math.round(0.4 * sr), hop = Math.round(0.1 * sr), blocks = [];   // gated, as for a whole programme
  for (let s = 0; s + w <= len; s += hop) blocks.push((sq[s + w] - sq[s]) / w);
  const above = blocks.filter(z => L(z) > -70);
  const mean = a => a.reduce((p, q) => p + q, 0) / a.length;
  const rel = above.length ? L(mean(above)) - 10 : -70;
  const gated = above.filter(z => L(z) > rel);

    peakDb: +(20 * Math.log10(Math.max(peak, 1e-20))).toFixed(2),
    loudness: +windowMax(0.4).toFixed(2),         // momentary loudness at its loudest (LUFS)
    fast: +windowMax(0.1).toFixed(2),             // the same over a tenth of a second
    integrated: gated.length ? +L(mean(gated)).toFixed(2) : null,
  };
}

  get state() { return { mode, focus: focus.id, modal: modal.open ? modal.id : -1, drone: drone.active, awake: sim.awake, fallback: drone.fallback, look: drone.look }; },
  count: N,

  overlap: () => {

    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) {
      const d = Math.hypot(P[i * 3] - P[j * 3], P[i * 3 + 1] - P[j * 3 + 1], P[i * 3 + 2] - P[j * 3 + 2]);

  },
  maxGap: () => { const g = gapMax; gapMax = 0; return Math.round(g); },   // longest wait between two frames, in ms
  // how round the ball's outline is, seen from 60 directions: overall lumpiness (low), how far the outline's

  roundness: () => {
    const rnd = seeded(7), views = 60;
    let cx = 0, cy = 0, cz = 0;
    for (let i = 0; i < N; i++) { cx += P[i * 3] / N; cy += P[i * 3 + 1] / N; cz += P[i * 3 + 2] / N; }
    let low = 0, lowWorst = 0, env = 0, scallop = 0;
    for (let v = 0; v < views; v++) {
      const u = rnd() * 2 - 1, ph = rnd() * Math.PI * 2, sn = Math.sqrt(1 - u * u);
      const d = new THREE.Vector3(sn * Math.cos(ph), sn * Math.sin(ph), u);
      const e1 = new THREE.Vector3().crossVectors(d, Math.abs(d.x) < 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0)).normalize();
      const e2 = new THREE.Vector3().crossVectors(d, e1);

  // frame timing over a stretch of ms: time between frames, script time per frame, graphics-card time per frame
  frameTime: ms => new Promise(res => {

  bench: (n = 30) => {
    const gl = renderer.getContext(), ext = gl.getExtension('EXT_disjoint_timer_query_webgl2'), px = new Uint8Array(4);
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);                 // start from an idle card

    if (q) gl.endQuery(ext.TIME_ELAPSED_EXT);

        const ns = gl.getQueryParameter(q, gl.QUERY_RESULT);

  },
  // Over a full slow turn of the view: how often two orbs swap drawing order while they overlap on screen (each
  // such swap would show as a pop). The order used here should give none; plain depth order (as before) is shown too.
  sortCheck: (steps = 720) => {
    const s0 = cameraAngles(), cam = new THREE.Vector3(), fwd = new THREE.Vector3();
    const power = new Float64Array(N), plain = new Float64Array(N);
    const rankOf = key => { const o = Array.from({ length: N }, (_, i) => i).sort((a, b) => key[b] - key[a] || a - b), r = new Int32Array(N); o.forEach((i, k) => { r[i] = k; }); return r; };
    const overlap = (a, b) => {
      const ax = P[a * 3] - cam.x, ay = P[a * 3 + 1] - cam.y, az = P[a * 3 + 2] - cam.z, bx = P[b * 3] - cam.x, by = P[b * 3 + 1] - cam.y, bz = P[b * 3 + 2] - cam.z;
      const da = Math.hypot(ax, ay, az), db = Math.hypot(bx, by, bz);

  layers: o => { for (const [k, m] of Object.entries({ orbs, halos, floor })) if (k in o) m.visible = !!o[k]; },   // show or hide parts, to time them
